# render.yaml — Render deployment configuration for EcoNet backend.
#
# Production architecture:
#   Netlify  → React frontend (built from repo root, deployed to CDN)
#   Render   → Node.js Express backend (this service, server/)
#   Atlas    → MongoDB
#
# The root Dockerfile is a Docker Compose artifact for local development.
# Render deploys ONLY the backend service defined here.

services:
  - type: web
    name: econet-api
    runtime: docker
    # Build from server/Dockerfile, not the root Dockerfile (which is the
    # local-dev nginx frontend image and has no backend runtime).
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    # Render injects PORT automatically; server/index.js reads process.env.PORT.
    envVars:
      - key: NODE_ENV
        value: production
      # The following secrets must be set in the Render dashboard —
      # they are listed here without values so Render knows they are required.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CANONICAL_PERSISTENCE
        value: mongo
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Set this to the deployed Netlify URL so CORS allows the frontend.
      - key: FRONTEND_URL
        value: https://econet.netlify.app
