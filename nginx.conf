events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # SPA routing — all unknown paths return index.html so the React
        # router handles navigation client-side.
        # API calls are made directly to the Render backend via VITE_API_URL
        # baked into the frontend bundle at build time; no proxy is needed.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
